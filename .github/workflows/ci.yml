name: CI

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Dockerfile'
      - 'index.html'
      - '.env.template'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check:ts

  docker:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          no-cache: true
          build-args: |
            VITE_APP_NAME=yapping
            VITE_APP_DESCRIPTION=Yapping - curhat anonim, anti-somasi. Platform percakapan bebas sensor berbasis Nostr.
          tags: |
            ghcr.io/${{ github.repository }}/suara:latest
            ghcr.io/${{ github.repository }}/suara:${{ github.sha }}

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: docker
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          cd $HOME/suara
          echo "Deploying ${{ github.repository }}..."
          export GITHUB_REPOSITORY=${{ github.repository }}
          docker compose pull
          docker compose up -d
          echo "Deploy complete."